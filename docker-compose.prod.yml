# =============================================================================
# Production overlay.
#
# Apply on top of docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Changes vs dev:
#   - backend uses Dockerfile.prod (multi-stage, no source bind mount, no hot-reload)
#   - frontend uses Dockerfile.prod (built static assets served by nginx)
#   - Internal services NOT exposed on the host
#   - Single public ingress on nginx :80
#   - .env.prod is the source of truth
# =============================================================================

services:
  postgres:
    ports: []

  redis:
    ports: []

  chroma:
    ports: []

  backend:
    build:
      context: ./backend-ts
      dockerfile: Dockerfile.prod
    env_file: .env.prod
    environment:
      APP_ENV: prod
      PORT: "8000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-stockai}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-stockai}?schema=public
      REDIS_HOST: redis
      CHROMA_HOST: chroma
    ports: []
    volumes: []
    # Idempotent schema push — creates tables on fresh DB, no-op when schema matches.
    command: ["sh", "-c", "npx prisma db push --skip-generate --accept-data-loss && node dist/server.js"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_WS_URL: /api/v1/ws
    ports: []
    volumes: []
    command: ["nginx", "-g", "daemon off;"]

  nginx:
    image: nginx:1.27-alpine
    container_name: sis_nginx
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
    restart: unless-stopped

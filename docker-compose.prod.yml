# =============================================================================
# Production overrides.
# Apply on top of docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Changes vs dev:
#   - Backend + Frontend use Dockerfile.prod (multi-stage, no source bind mount)
#   - No --reload, more workers
#   - Internal services NOT exposed on the host (postgres/redis/chroma/backend/frontend)
#   - Single public ingress on nginx :80
#   - .env.prod is the source of truth
# =============================================================================

services:
  postgres:
    ports: []

  redis:
    ports: []

  chroma:
    ports: []

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    env_file: .env.prod
    environment:
      APP_ENV: prod
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      CHROMA_HOST: chroma
      FASTEMBED_CACHE_PATH: /var/cache/fastembed
    ports: []
    volumes:
      - fastembed_cache:/var/cache/fastembed
    # Replace dev command (which had --reload + bind-mounted /app/app)
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --workers 2
      --proxy-headers
      --forwarded-allow-ips=*

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_WS_URL: /api/v1/ws
    ports: []
    volumes: []
    # Override the dev command (which was npm run dev)
    command: ["nginx", "-g", "daemon off;"]

  nginx:
    image: nginx:1.27-alpine
    container_name: sis_nginx
    ports:
      - "80:80"
      # Uncomment to terminate TLS here once you've added a cert:
      # - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./infra/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped

# =============================================================================
# Local development stack (100% TypeScript backend).
#   - postgres : transactional store (users, watchlists, insights, agent logs)
#   - redis    : cache + streams (real-time pipeline)
#   - chroma   : vector store for the RAG pipeline
#   - backend  : Fastify + TypeScript API, hot-reloads from ./backend-ts
#   - frontend : Vite + React UI
#
# Ollama runs natively on the HOST (not in this file). The backend reaches it
# at http://host.docker.internal:11434 (works on macOS & Windows Docker Desktop).
# Use `npm run dev` to bring the whole environment up with health checks.
# =============================================================================

# Shared log rotation so container logs never fill the disk.
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    container_name: sis_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stockai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockai}
      POSTGRES_DB: ${POSTGRES_DB:-stockai}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stockai} -d ${POSTGRES_DB:-stockai}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging: *default-logging
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sis_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    logging: *default-logging
    restart: unless-stopped

  chroma:
    image: chromadb/chroma:0.5.20
    container_name: sis_chroma
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    healthcheck:
      # Chroma's image is Python-based; use urllib rather than assuming curl.
      test:
        - "CMD-SHELL"
        - "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/heartbeat').status==200 else 1)\" || exit 1"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    logging: *default-logging
    restart: unless-stopped

  # Fastify + TypeScript API. Hot-reloads via `tsx watch` on the mounted source.
  # `prisma db push` at startup is idempotent — creates tables on a fresh DB,
  # no-op when the schema already matches.
  backend:
    build:
      context: ./backend-ts
      dockerfile: Dockerfile
    container_name: sis_backend
    env_file: .env
    environment:
      APP_ENV: dev
      PORT: "8000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-stockai}:${POSTGRES_PASSWORD:-stockai}@postgres:5432/${POSTGRES_DB:-stockai}?schema=public
      REDIS_HOST: redis
      CHROMA_HOST: chroma
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ./backend-ts/src:/app/src
      - ./backend-ts/prisma:/app/prisma
      - backend_node_modules:/app/node_modules
    command:
      ["sh", "-c", "npx prisma db push --skip-generate --accept-data-loss && npm run dev"]
    healthcheck:
      # node:20-slim ships Node 20 (global fetch). Reports healthy once the API answers.
      test:
        - "CMD-SHELL"
        - "node -e \"fetch('http://localhost:8000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s
    logging: *default-logging
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sis_frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
      VITE_WS_URL: ws://localhost:8000/api/v1/ws
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # Named volume so node_modules from the image is preserved when the
      # source is bind-mounted on top.
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # node:20-alpine ships busybox wget.
      test: ["CMD-SHELL", "wget -qO- http://localhost:5173/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *default-logging
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  chroma_data:
  frontend_node_modules:
  backend_node_modules:

# =============================================================================
# Reverse proxy — single public entry on :80.
#   /api/v1/ws  -> backend (WebSocket upgrade)
#   /api/*      -> backend (REST)
#   /           -> frontend (SPA)
# =============================================================================

upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:80;
}

# Standard Upgrade-mapping for WebSockets.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;

    # RAG file upload cap (Phase 4 enforces 10 MB at the app layer; allow a buffer)
    client_max_body_size 25M;

    # -------------------- WebSocket --------------------
    # MUST be matched before /api/ — most specific wins, but with prefix matches
    # location order is by specificity. We use an exact-prefix match.
    location /api/v1/ws {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Keep WS alive for long sessions (24h)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # -------------------- REST API --------------------
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # POST /api/v1/agents/analyze can take 60–120 s on Ollama
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # Disable buffering for SSE (/llm/stream)
        proxy_buffering off;
    }

    # -------------------- Frontend (SPA) --------------------
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
    }
}

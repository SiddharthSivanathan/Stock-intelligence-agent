# SPA-serving nginx — sits inside the frontend container, fronted by the
# top-level reverse-proxy nginx for /api and /api/v1/ws.

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any path that isn't a real file gets index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived caching for hashed asset bundles (Vite outputs hashed names)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Don't cache the HTML shell — must always pick up new asset hashes.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Common security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
